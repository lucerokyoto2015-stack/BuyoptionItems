<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucero京都 オプションアイテム購入申し込み</title>
  <style>
    :root {
      --primary-color: #0d1b2a;
      --brand-yellow: #ffd600;
      --brand-yellow-hover: #e6c200;
      --bg-color: #080f18;
      --card-bg: #132238;
      --text-color: #ffffff;
      --text-sub: #b0c4de;
      --border-color: #233854;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding-bottom: 120px;
    }

    header {
      background: linear-gradient(135deg, #050a10 0%, var(--primary-color) 100%);
      border-bottom: 3px solid var(--brand-yellow);
      color: white;
      text-align: center;
      padding: 28px 16px;
      margin-bottom: 24px;
    }

    header h1 span { color: var(--brand-yellow); }

    .container { max-width: 800px; margin: 0 auto; padding: 0 16px; }

    .step-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 24px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 16px;
    }

    .step-indicator {
      flex: 1;
      text-align: center;
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--text-sub);
      position: relative;
    }

    .step-indicator.active { color: var(--brand-yellow); }
    .step-indicator.active::after {
      content: '';
      position: absolute;
      bottom: -12px;
      left: 0;
      width: 100%;
      height: 3px;
      background-color: var(--brand-yellow);
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      border: 1px solid var(--border-color);
    }

    .card h2 {
      font-size: 1.25rem;
      border-bottom: 2px solid var(--brand-yellow);
      padding-bottom: 8px;
      margin-bottom: 20px;
      color: var(--brand-yellow);
    }

    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 0.95rem; }
    .form-group label .required { color: var(--brand-yellow); margin-left: 4px; }

    .form-control {
      width: 100%;
      padding: 12px;
      background-color: #0b1524;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 1rem;
      color: #ffffff;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--brand-yellow);
      box-shadow: 0 0 0 2px rgba(255, 214, 0, 0.2);
    }

    .item-card {
      border-bottom: 1px solid var(--border-color);
      padding: 16px 0;
    }

    .item-card:last-child { border-bottom: none; }

    .item-main-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 12px;
      align-items: center;
    }

    .item-name { font-weight: bold; font-size: 1.05rem; }
    .item-price { color: var(--text-sub); font-size: 0.9rem; }

    .name-print-option {
      display: none;
      background: rgba(255, 214, 0, 0.05);
      border: 1px dashed var(--brand-yellow);
      border-radius: 6px;
      padding: 12px;
      margin-top: 12px;
    }

    .name-print-option.active { display: block; }
    .name-hint { font-size: 0.8rem; color: var(--text-sub); margin-top: 4px; }

    .summary-popup {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #080f18;
      border-top: 3px solid var(--brand-yellow);
      box-shadow: 0 -6px 20px rgba(0,0,0,0.5);
      padding: 16px;
      z-index: 1000;
    }

    .summary-content {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .summary-info strong { color: var(--brand-yellow); font-size: 1.3rem; margin: 0 4px; }

    .btn {
      background-color: var(--brand-yellow);
      color: #000000;
      border: none;
      padding: 12px 28px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover { background-color: var(--brand-yellow-hover); }
    .btn:disabled { background-color: #4a5568; color: #a0aec0; cursor: not-allowed; }

    .btn-secondary {
      background-color: transparent;
      color: var(--text-sub);
      border: 1px solid var(--border-color);
      margin-right: 12px;
    }

    .step { display: none; }
    .step.active { display: block; }

    .confirm-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    .confirm-table th, .confirm-table td {
      padding: 12px;
      border-bottom: 1px solid var(--border-color);
      text-align: left;
    }

    .confirm-table th { background-color: #0b1524; color: var(--text-sub); width: 30%; }

    .checkbox-container {
      background: rgba(255, 214, 0, 0.08);
      border: 1px solid var(--brand-yellow);
      padding: 16px;
      border-radius: 6px;
      margin-bottom: 24px;
    }

    .checkbox-container label { display: flex; gap: 12px; cursor: pointer; }
    .checkbox-container input[type="checkbox"] { accent-color: var(--brand-yellow); }

    .actions { display: flex; justify-content: flex-end; margin-top: 24px; }

    @media (max-width: 600px) {
      .item-main-row { grid-template-columns: 1fr 1fr; gap: 8px; }
      .item-info { grid-column: span 2; }
      .summary-content { flex-direction: column; gap: 12px; text-align: center; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>

  <header>
    <h1><span>Lucero京都</span> オプションアイテム購入申込</h1>
  </header>

  <div class="container">
    <div class="step-bar">
      <div id="ind-step1" class="step-indicator active">1. アイテム選択</div>
      <div id="ind-step2" class="step-indicator">2. 個人情報入力</div>
      <div id="ind-step3" class="step-indicator">3. 確認・送信</div>
    </div>

    <form id="orderForm">
      <div id="step1" class="step active">
        <div class="card">
          <h2>① 購入アイテム選択</h2>
          <div id="itemList">
            <p style="color: var(--text-sub);">アイテム情報を読み込み中...</p>
          </div>
        </div>
      </div>

      <div id="step2" class="step">
        <div class="card">
          <h2>② 選手・保護者情報の入力</h2>
          <div class="form-group">
            <label for="grade">学年<span class="required">*</span></label>
            <select id="grade" class="form-control" required>
              <option value="">選択してください</option>
              <option value="U13">U13</option>
              <option value="U14">U14</option>
              <option value="U15">U15</option>
            </select>
          </div>
          <div class="form-group">
            <label for="playerName">選手氏名（漢字フルネーム）<span class="required">*</span></label>
            <input type="text" id="playerName" class="form-control" placeholder="例：ルチェーロ 太郎" required>
          </div>
          <div class="form-group">
            <label for="uniformNumber">背番号<span class="required">*</span></label>
            <input type="number" id="uniformNumber" class="form-control" placeholder="例：10" required>
          </div>
          <div class="form-group">
            <label for="email">メールアドレス<span class="required">*</span></label>
            <input type="email" id="email" class="form-control" placeholder="例：example@example.com" required>
          </div>

          <div class="actions">
            <button type="button" class="btn btn-secondary" onclick="goToStep(1)">アイテム選択に戻る</button>
            <button type="button" class="btn" onclick="validateStep2AndGoConfirm()">確認画面へ進む</button>
          </div>
        </div>
      </div>

      <div id="step3" class="step">
        <div class="card">
          <h2>③ 申し込み内容の確認</h2>
          
          <h3 style="font-size: 1rem; color: var(--brand-yellow); margin-bottom: 8px;">【お申込者情報】</h3>
          <table class="confirm-table">
            <tr><th>学年</th><td id="confirmGrade"></td></tr>
            <tr><th>選手氏名</th><td id="confirmName"></td></tr>
            <tr><th>背番号</th><td id="confirmNumber"></td></tr>
            <tr><th>メールアドレス</th><td id="confirmEmail"></td></tr>
          </table>

          <h3 style="font-size: 1rem; color: var(--brand-yellow); margin-bottom: 8px;">【選択アイテム】</h3>
          <table class="confirm-table">
            <thead>
              <tr>
                <th>商品名</th>
                <th>サイズ / 背ネーム</th>
                <th>数量</th>
                <th>小計（税込）</th>
              </tr>
            </thead>
            <tbody id="confirmItems"></tbody>
          </table>

          <div style="text-align: right; font-size: 1.25rem; font-weight: bold; margin-bottom: 24px;">
            総合計金額（税込）: <span id="confirmTotal" style="color: var(--brand-yellow);">¥0</span>
          </div>

          <div class="checkbox-container">
            <label>
              <input type="checkbox" id="agreeTerms">
              <span>入力した内容に間違いはありません。また、メーカーの在庫状況やデザイン変更等によりご用意できない場合があることを確認しました。</span>
            </label>
          </div>

          <div class="actions">
            <button type="button" class="btn btn-secondary" onclick="goToStep(2)">情報入力に戻る</button>
            <button type="submit" id="submitBtn" class="btn" disabled>申込する</button>
          </div>
        </div>
      </div>

      <div id="step4" class="step">
        <div class="card" style="text-align: center; padding: 48px 24px;">
          <h2 style="border: none; color: var(--brand-yellow);">申し込みが完了しました</h2>
          <p style="margin-top: 16px;">ご入力いただいたメールアドレス宛に、お申し込み詳細の確認メールを送信いたしました。</p>
        </div>
      </div>
    </form>
  </div>

  <div id="summaryPopup" class="summary-popup">
    <div class="summary-content">
      <div class="summary-info">
        選択数: <strong id="totalCount">0</strong> 点 / 
        合計金額（税込）: <strong id="totalAmount">¥0</strong>
      </div>
      <button type="button" class="btn" onclick="validateStep1AndGoNext()">個人情報入力に進む</button>
    </div>
  </div>

  <script>
    // ↓ デプロイ時に発行されたGASの「ウェブアプリURL（末尾が /exec）」を貼り付けてください➤入力済み8/31家城
    const GAS_ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbyNqfDEIm74ngKv8CEesCHG3Jh7LJTd6aLjRptFWR9wXWA8Iw3aRAYNwLo5_fzMmlHwJA/exec";

    let availableItems = [];

    document.addEventListener("DOMContentLoaded", fetchItems);

    async function fetchItems() {
      try {
        const res = await fetch(GAS_ENDPOINT_URL);
        availableItems = await res.json();
        renderItems(availableItems);
      } catch (err) {
        console.error("商品読み込み失敗", err);
        document.getElementById("itemList").innerHTML = "<p style='color:red;'>商品の読み込みに失敗しました。</p>";
      }
    }

    function renderItems(items) {
      const container = document.getElementById("itemList");
      container.innerHTML = "";

      items.forEach(item => {
        const card = document.createElement("div");
        card.className = "item-card";
        
        const sizeOptions = item.sizes.map(s => `<option value="${s}">${s}</option>`).join("");
        const qtyOptions = Array.from({length: 6}, (_, i) => `<option value="${i}">${i}</option>`).join("");
        const isPracticeShirt = item.name.includes("プラクティスシャツ");

        card.innerHTML = `
          <div class="item-main-row">
            <div class="item-info">
              <div class="item-name">${item.name}</div>
              <div class="item-price">¥${item.price.toLocaleString()} (税込)</div>
            </div>
            <div>
              <select class="form-control item-size" data-id="${item.id}">${sizeOptions}</select>
            </div>
            <div>
              <select class="form-control item-qty" data-id="${item.id}" data-price="${item.price}" data-name="${item.name}" data-isshirt="${isPracticeShirt}" onchange="handleQtyChange(this)">
                ${qtyOptions}
              </select>
            </div>
            <div class="item-subtotal" id="subtotal-${item.id}" style="text-align: right; font-weight: bold; color: var(--brand-yellow);">
              ¥0
            </div>
          </div>

          ${isPracticeShirt ? `
            <div class="name-print-option" id="nameOption-${item.id}">
              <label style="font-size: 0.9rem; font-weight: bold; color: var(--brand-yellow);">背中のプリントネーム（半角英大文字のみ）<span class="required">*</span></label>
              <input type="text" class="form-control item-print-name" id="printName-${item.id}" placeholder="例：TARO" oninput="formatUpperAlpha(this)">
              <div class="name-hint">※半角アルファベット大文字・スペースのみ入力可能です（自動変換されます）。</div>
            </div>
          ` : ''}
        `;
        container.appendChild(card);
      });
    }

    function formatUpperAlpha(input) {
      input.value = input.value.toUpperCase().replace(/[^A-Z\s]/g, '');
    }

    function handleQtyChange(selectEl) {
      const itemId = selectEl.dataset.id;
      const isShirt = selectEl.dataset.isshirt === "true";
      const qty = parseInt(selectEl.value, 10);

      if (isShirt) {
        const optionBox = document.getElementById(`nameOption-${itemId}`);
        if (qty > 0) {
          optionBox.classList.add("active");
        } else {
          optionBox.classList.remove("active");
          document.getElementById(`printName-${itemId}`).value = "";
        }
      }
      calculateTotal();
    }

    function calculateTotal() {
      let totalQty = 0;
      let totalPrice = 0;

      document.querySelectorAll(".item-qty").forEach(select => {
        const qty = parseInt(select.value, 10);
        const price = parseInt(select.dataset.price, 10);
        const itemId = select.dataset.id;

        if (qty > 0) {
          totalQty += qty;
          totalPrice += price * qty;
        }
        const subtotalEl = document.getElementById(`subtotal-${itemId}`);
        if (subtotalEl) subtotalEl.textContent = `¥${(price * qty).toLocaleString()}`;
      });

      document.getElementById("totalCount").textContent = totalQty;
      document.getElementById("totalAmount").textContent = `¥${totalPrice.toLocaleString()}`;
      return { totalQty, totalPrice };
    }

    function validateStep1AndGoNext() {
      const { totalQty } = calculateTotal();
      if (totalQty === 0) {
        alert("アイテムを1点以上選択してください。");
        return;
      }

      let valid = true;
      document.querySelectorAll(".item-qty").forEach(select => {
        const qty = parseInt(select.value, 10);
        const isShirt = select.dataset.isshirt === "true";
        const itemId = select.dataset.id;

        if (qty > 0 && isShirt) {
          const printName = document.getElementById(`printName-${itemId}`).value.trim();
          if (!printName) {
            alert("プラクティスシャツの背プリントネーム（ローマ字大文字）を入力してください。");
            valid = false;
          }
        }
      });

      if (valid) goToStep(2);
    }

    function validateStep2AndGoConfirm() {
      const grade = document.getElementById("grade").value;
      const playerName = document.getElementById("playerName").value.trim();
      const uniformNumber = document.getElementById("uniformNumber").value;
      const email = document.getElementById("email").value.trim();

      if (!grade || !playerName || !uniformNumber || !email) {
        alert("すべての必須項目（*）を入力してください。");
        return;
      }

      document.getElementById("confirmGrade").textContent = grade;
      document.getElementById("confirmName").textContent = playerName;
      document.getElementById("confirmNumber").textContent = uniformNumber;
      document.getElementById("confirmEmail").textContent = email;

      const confirmItemsContainer = document.getElementById("confirmItems");
      confirmItemsContainer.innerHTML = "";

      document.querySelectorAll(".item-qty").forEach(select => {
        const qty = parseInt(select.value, 10);
        if (qty > 0) {
          const itemId = select.dataset.id;
          const itemName = select.dataset.name;
          const price = parseInt(select.dataset.price, 10);
          const isShirt = select.dataset.isshirt === "true";

          const sizeSelect = document.querySelector(`.item-size[data-id="${itemId}"]`);
          let sizeText = sizeSelect ? sizeSelect.value : "-";

          if (isShirt) {
            const printName = document.getElementById(`printName-${itemId}`).value.trim();
            sizeText += ` / 背ネーム: ${printName}`;
          }

          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${itemName}</td>
            <td>${sizeText}</td>
            <td>${qty}</td>
            <td>¥${(price * qty).toLocaleString()}</td>
          `;
          confirmItemsContainer.appendChild(tr);
        }
      });

      const { totalPrice } = calculateTotal();
      document.getElementById("confirmTotal").textContent = `¥${totalPrice.toLocaleString()}`;

      goToStep(3);
    }

    function goToStep(stepNumber) {
      document.querySelectorAll(".step").forEach(el => el.classList.remove("active"));
      document.getElementById(`step${stepNumber}`).classList.add("active");

      for (let i = 1; i <= 3; i++) {
        const ind = document.getElementById(`ind-step${i}`);
        if (ind) ind.classList.toggle("active", i === stepNumber);
      }

      document.getElementById("summaryPopup").style.display = (stepNumber === 1) ? "block" : "none";
      window.scrollTo(0, 0);
    }

    document.getElementById("agreeTerms").addEventListener("change", (e) => {
      document.getElementById("submitBtn").disabled = !e.target.checked;
    });

    document.getElementById("orderForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.textContent = "送信中...";

      const selectedItems = [];
      document.querySelectorAll(".item-qty").forEach(select => {
        const qty = parseInt(select.value, 10);
        if (qty > 0) {
          const itemId = select.dataset.id;
          const isShirt = select.dataset.isshirt === "true";
          const sizeSelect = document.querySelector(`.item-size[data-id="${itemId}"]`);
          const printNameInput = document.getElementById(`printName-${itemId}`);
          const itemData = availableItems.find(i => i.id === itemId);

          selectedItems.push({
            code: itemData ? itemData.code : "",
            name: select.dataset.name,
            color: itemData ? itemData.color : "",
            price: parseInt(select.dataset.price, 10),
            size: sizeSelect ? sizeSelect.value : "-",
            printName: (isShirt && printNameInput) ? printNameInput.value.trim() : "",
            qty: qty
          });
        }
      });

      const payload = {
        grade: document.getElementById("grade").value,
        playerName: document.getElementById("playerName").value.trim(),
        uniformNumber: document.getElementById("uniformNumber").value,
        email: document.getElementById("email").value.trim(),
        items: selectedItems,
        totalAmount: calculateTotal().totalPrice
      };

      try {
        await fetch(GAS_ENDPOINT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        goToStep(4);
      } catch (err) {
        console.error("送信エラー:", err);
        alert("送信に失敗しました。時間をおいて再度お試しください。");
        submitBtn.disabled = false;
        submitBtn.textContent = "申込する";
      }
    });
  </script>
</body>
</html>
