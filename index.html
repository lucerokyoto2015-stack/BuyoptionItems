<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucero京都 オプションアイテム購入申し込み</title>
  <style>
    :root {
      --primary-color: #0d1b2a;
      --brand-yellow: #ffd600;
      --brand-yellow-hover: #e6c200;
      --bg-color: #080f18;
      --card-bg: #132238;
      --text-color: #ffffff;
      --text-sub: #b0c4de;
      --border-color: #233854;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding-bottom: 120px;
    }

    header {
      background: linear-gradient(135deg, #050a10 0%, var(--primary-color) 100%);
      border-bottom: 3px solid var(--brand-yellow);
      color: white;
      text-align: center;
      padding: 28px 16px;
      margin-bottom: 24px;
    }

    header h1 span { color: var(--brand-yellow); }

    .container { max-width: 800px; margin: 0 auto; padding: 0 16px; }

    .step-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 24px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 16px;
    }

    .step-indicator {
      flex: 1;
      text-align: center;
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--text-sub);
      position: relative;
    }

    .step-indicator.active { color: var(--brand-yellow); }
    .step-indicator.active::after {
      content: '';
      position: absolute;
      bottom: -12px;
      left: 0;
      width: 100%;
      height: 3px;
      background-color: var(--brand-yellow);
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      border: 1px solid var(--border-color);
    }

    .card h2 {
      font-size: 1.25rem;
      border-bottom: 2px solid var(--brand-yellow);
      padding-bottom: 8px;
      margin-bottom: 20px;
      color: var(--brand-yellow);
    }

    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 0.95rem; }
    .form-group label .required { color: var(--brand-yellow); margin-left: 4px; }

    .form-control {
      width: 100%;
      padding: 10px;
      background-color: #0b1524;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.95rem;
      color: #ffffff;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--brand-yellow);
      box-shadow: 0 0 0 2px rgba(255, 214, 0, 0.2);
    }

    .item-card {
      border-bottom: 1px solid var(--border-color);
      padding: 20px 0;
    }

    .item-card:last-child { border-bottom: none; }

    .item-header { margin-bottom: 12px; }
    .item-title { font-weight: bold; font-size: 1.1rem; }
    .item-price { color: var(--text-sub); font-size: 0.9rem; }

    .selection-row {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 8px;
    }

    .selection-controls {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .btn-remove {
      background: #e53e3e;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .btn-add-row {
      background: transparent;
      color: var(--brand-yellow);
      border: 1px dashed var(--brand-yellow);
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn-add-row:hover { background: rgba(255, 214, 0, 0.1); }

    .name-print-box {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border-color);
    }

    .summary-popup {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #080f18;
      border-top: 3px solid var(--brand-yellow);
      box-shadow: 0 -6px 20px rgba(0,0,0,0.5);
      padding: 16px;
      z-index: 1000;
    }

    .summary-content {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .summary-info strong { color: var(--brand-yellow); font-size: 1.3rem; margin: 0 4px; }

    .btn {
      background-color: var(--brand-yellow);
      color: #000000;
      border: none;
      padding: 12px 28px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover { background-color: var(--brand-yellow-hover); }
    .btn:disabled { background-color: #4a5568; color: #a0aec0; cursor: not-allowed; }

    .btn-secondary {
      background-color: transparent;
      color: var(--text-sub);
      border: 1px solid var(--border-color);
      margin-right: 12px;
    }

    .step { display: none; }
    .step.active { display: block; }

    .confirm-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    .confirm-table th, .confirm-table td {
      padding: 12px;
      border-bottom: 1px solid var(--border-color);
      text-align: left;
    }

    .confirm-table th { background-color: #0b1524; color: var(--text-sub); width: 30%; }

    .checkbox-container {
      background: rgba(255, 214, 0, 0.08);
      border: 1px solid var(--brand-yellow);
      padding: 16px;
      border-radius: 6px;
      margin-bottom: 24px;
    }

    .checkbox-container label { display: flex; gap: 12px; cursor: pointer; }
    .checkbox-container input[type="checkbox"] { accent-color: var(--brand-yellow); }

    .actions { display: flex; justify-content: flex-end; margin-top: 24px; }

    @media (max-width: 600px) {
      .selection-controls { grid-template-columns: 1fr 1fr; }
      .btn-remove { grid-column: span 2; }
      .summary-content { flex-direction: column; gap: 12px; text-align: center; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>

  <header>
    <h1><span>Lucero京都</span> オプションアイテム購入申込</h1>
  </header>

  <div class="container">
    <div class="step-bar">
      <div id="ind-step1" class="step-indicator active">1. アイテム選択</div>
      <div id="ind-step2" class="step-indicator">2. 個人情報入力</div>
      <div id="ind-step3" class="step-indicator">3. 確認・送信</div>
    </div>

    <form id="orderForm">
      <!-- STEP 1 -->
      <div id="step1" class="step active">
        <div class="card">
          <h2>① 購入アイテム選択</h2>
          <div id="itemList">
            <p style="color: var(--text-sub);">アイテム情報を読み込み中...</p>
          </div>
        </div>
      </div>

      <!-- STEP 2 -->
      <div id="step2" class="step">
        <div class="card">
          <h2>② 選手・保護者情報の入力</h2>
          <div class="form-group">
            <label for="grade">学年<span class="required">*</span></label>
            <select id="grade" class="form-control" required>
              <option value="">選択してください</option>
              <option value="U13">U13</option>
              <option value="U14">U14</option>
              <option value="U15">U15</option>
            </select>
          </div>
          <div class="form-group">
            <label for="playerName">選手氏名（漢字フルネーム）<span class="required">*</span></label>
            <input type="text" id="playerName" class="form-control" placeholder="例：ルチェーロ 太郎" required>
          </div>
          <div class="form-group">
            <label for="uniformNumber">背番号<span class="required">*</span></label>
            <input type="number" id="uniformNumber" class="form-control" placeholder="例：10" required>
          </div>
          <div class="form-group">
            <label for="email">メールアドレス<span class="required">*</span></label>
            <input type="email" id="email" class="form-control" placeholder="例：example@example.com" required>
          </div>

          <div class="actions">
            <button type="button" class="btn btn-secondary" onclick="goToStep(1)">アイテム選択に戻る</button>
            <button type="button" class="btn" onclick="validateStep2AndGoConfirm()">確認画面へ進む</button>
          </div>
        </div>
      </div>

      <!-- STEP 3 -->
      <div id="step3" class="step">
        <div class="card">
          <h2>③ 申し込み内容の確認</h2>
          
          <h3 style="font-size: 1rem; color: var(--brand-yellow); margin-bottom: 8px;">【お申込者情報】</h3>
          <table class="confirm-table">
            <tr><th>学年</th><td id="confirmGrade"></td></tr>
            <tr><th>選手氏名</th><td id="confirmName"></td></tr>
            <tr><th>背番号</th><td id="confirmNumber"></td></tr>
            <tr><th>メールアドレス</th><td id="confirmEmail"></td></tr>
          </table>

          <h3 style="font-size: 1rem; color: var(--brand-yellow); margin-bottom: 8px;">【選択アイテム】</h3>
          <table class="confirm-table">
            <thead>
              <tr>
                <th>商品名</th>
                <th>サイズ / 背ネーム</th>
                <th>数量</th>
                <th>小計（税込）</th>
              </tr>
            </thead>
            <tbody id="confirmItems"></tbody>
          </table>

          <div style="text-align: right; font-size: 1.25rem; font-weight: bold; margin-bottom: 24px;">
            総合計金額（税込）: <span id="confirmTotal" style="color: var(--brand-yellow);">¥0</span>
          </div>

          <div class="checkbox-container">
            <label>
              <input type="checkbox" id="agreeTerms">
              <span>入力した内容に間違いはありません。また、メーカーの在庫状況やデザイン変更等によりご用意できない場合があることを確認しました。</span>
            </label>
          </div>

          <div class="actions">
            <button type="button" class="btn btn-secondary" onclick="goToStep(2)">情報入力に戻る</button>
            <button type="submit" id="submitBtn" class="btn" disabled>申込する</button>
          </div>
        </div>
      </div>

      <!-- STEP 4 -->
      <div id="step4" class="step">
        <div class="card" style="text-align: center; padding: 48px 24px;">
          <h2 style="border: none; color: var(--brand-yellow);">申し込みが完了しました</h2>
          <p style="margin-top: 16px;">ご入力いただいたメールアドレス宛に、お申し込み詳細の確認メールを送信いたしました。</p>
        </div>
      </div>
    </form>
  </div>

  <div id="summaryPopup" class="summary-popup">
    <div class="summary-content">
      <div class="summary-info">
        選択数: <strong id="totalCount">0</strong> 点 / 
        合計金額（税込）: <strong id="totalAmount">¥0</strong>
      </div>
      <button type="button" class="btn" onclick="validateStep1AndGoNext()">個人情報入力に進む</button>
    </div>
  </div>

  <script>
    // デプロイしたGASの「ウェブアプリURL」を入力してください
    const GAS_ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbyNqfDEIm74ngKv8CEesCHG3Jh7LJTd6aLjRptFWR9wXWA8Iw3aRAYNwLo5_fzMmlHwJA/exec";

    let availableItems = [];

    document.addEventListener("DOMContentLoaded", fetchItems);

    async function fetchItems() {
      try {
        const res = await fetch(GAS_ENDPOINT_URL);
        const data = await res.json();

        if (data.error) {
          throw new Error(data.error);
        }

        availableItems = data;
        renderItems(availableItems);
      } catch (err) {
        console.error("商品読み込み失敗:", err);
        document.getElementById("itemList").innerHTML = `<p style='color:#e53e3e;'>商品の読み込みに失敗しました。<br><small style="color:#b0c4de;">(${err.message})</small></p>`;
      }
    }

    function renderItems(items) {
      const container = document.getElementById("itemList");
      container.innerHTML = "";

      if (!items || items.length === 0) {
        container.innerHTML = "<p style='color: var(--text-sub);'>表示できる商品がありません。</p>";
        return;
      }

      items.forEach(item => {
        const card = document.createElement("div");
        card.className = "item-card";
        card.dataset.itemId = item.id;

        card.innerHTML = `
          <div class="item-header">
            <div class="item-title">${item.name}</div>
            <div class="item-price">¥${item.price.toLocaleString()} (税込)</div>
          </div>
          <div class="rows-container" id="rows-${item.id}"></div>
          <button type="button" class="btn-add-row" onclick="addSelectionRow('${item.id}')">＋ サイズ・数量を追加</button>
        `;

        container.appendChild(card);
        addSelectionRow(item.id);
      });
    }

    function addSelectionRow(itemId) {
      const item = availableItems.find(i => i.id === itemId);
      if (!item) return;

      const container = document.getElementById(`rows-${itemId}`);
      const rowIndex = container.children.length;
      const isShirt = item.name.includes("プラクティスシャツ");

      const sizeOptions = item.sizes.length > 0
        ? item.sizes.map(s => `<option value="${s}">${s}</option>`).join("")
        : `<option value="-">-</option>`;
      const qtyOptions = Array.from({length: 6}, (_, i) => `<option value="${i}">${i}</option>`).join("");

      const rowDiv = document.createElement("div");
      rowDiv.className = "selection-row";
      rowDiv.dataset.itemId = itemId;

      rowDiv.innerHTML = `
        <div class="selection-controls">
          <div>
            <select class="form-control row-size">${sizeOptions}</select>
          </div>
          <div>
            <select class="form-control row-qty" onchange="calculateTotal()">${qtyOptions}</select>
          </div>
          <div class="row-subtotal" style="text-align: right; font-weight: bold; color: var(--brand-yellow);">
            ¥0
          </div>
          <div>
            ${rowIndex > 0 ? `<button type="button" class="btn-remove" onclick="removeRow(this)">削除</button>` : `<span style="width:50px; display:inline-block;"></span>`}
          </div>
        </div>

        ${isShirt ? `
          <div class="name-print-box">
            <label style="font-size: 0.85rem; font-weight: bold; color: var(--brand-yellow);">背中のプリントネーム（半角英大文字）</label>
            <input type="text" class="form-control row-print-name" placeholder="例：TARO" oninput="formatUpperAlpha(this)" style="margin-top: 4px;">
          </div>
        ` : ''}
      `;

      container.appendChild(rowDiv);
      calculateTotal();
    }

    function removeRow(btn) {
      const row = btn.closest(".selection-row");
      row.remove();
      calculateTotal();
    }

    function formatUpperAlpha(input) {
      input.value = input.value.toUpperCase().replace(/[^A-Z\s]/g, '');
    }

    function calculateTotal() {
      let totalQty = 0;
      let totalPrice = 0;

      document.querySelectorAll(".selection-row").forEach(row => {
        const itemId = row.dataset.itemId;
        const item = availableItems.find(i => i.id === itemId);
        if (!item) return;

        const qty = parseInt(row.querySelector(".row-qty").value, 10);
        const subtotal = item.price * qty;

        row.querySelector(".row-subtotal").textContent = `¥${subtotal.toLocaleString()}`;

        if (qty > 0) {
          totalQty += qty;
          totalPrice += subtotal;
        }
      });

      document.getElementById("totalCount").textContent = totalQty;
      document.getElementById("totalAmount").textContent = `¥${totalPrice.toLocaleString()}`;
      return { totalQty, totalPrice };
    }

    function getSelectedItemsData() {
      const selected = [];

      document.querySelectorAll(".selection-row").forEach(row => {
        const itemId = row.dataset.itemId;
        const item = availableItems.find(i => i.id === itemId);
        if (!item) return;

        const qty = parseInt(row.querySelector(".row-qty").value, 10);
        if (qty > 0) {
          const size = row.querySelector(".row-size").value;
          const printInput = row.querySelector(".row-print-name");
          const printName = printInput ? printInput.value.trim() : "";

          selected.push({
            code: item.code,
            name: item.name,
            color: item.color,
            price: item.price,
            size: size,
            qty: qty,
            printName: printName,
            isShirt: item.name.includes("プラクティスシャツ")
          });
        }
      });

      return selected;
    }

    function validateStep1AndGoNext() {
      const selectedItems = getSelectedItemsData();

      if (selectedItems.length === 0) {
        alert("アイテムを1点以上選択してください。");
        return;
      }

      for (const item of selectedItems) {
        if (item.isShirt && !item.printName) {
          alert(`プラクティスシャツ（${item.size}サイズ）の背ネーム（ローマ字大文字）を入力してください。`);
          return;
        }
      }

      goToStep(2);
    }

    function validateStep2AndGoConfirm() {
      const grade = document.getElementById("grade").value;
      const playerName = document.getElementById("playerName").value.trim();
      const uniformNumber = document.getElementById("uniformNumber").value;
      const email = document.getElementById("email").value.trim();

      if (!grade || !playerName || !uniformNumber || !email) {
        alert("すべての必須項目（*）を入力してください。");
        return;
      }

      document.getElementById("confirmGrade").textContent = grade;
      document.getElementById("confirmName").textContent = playerName;
      document.getElementById("confirmNumber").textContent = uniformNumber;
      document.getElementById("confirmEmail").textContent = email;

      const confirmItemsContainer = document.getElementById("confirmItems");
      confirmItemsContainer.innerHTML = "";

      const selectedItems = getSelectedItemsData();

      selectedItems.forEach(item => {
        let sizeDetail = item.size;
        if (item.printName) {
          sizeDetail += ` / 背ネーム: ${item.printName}`;
        }

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${item.name}</td>
          <td>${sizeDetail}</td>
          <td>${item.qty}</td>
          <td>¥${(item.price * item.qty).toLocaleString()}</td>
        `;
        confirmItemsContainer.appendChild(tr);
      });

      const { totalPrice } = calculateTotal();
      document.getElementById("confirmTotal").textContent = `¥${totalPrice.toLocaleString()}`;

      goToStep(3);
    }

    function goToStep(stepNumber) {
      document.querySelectorAll(".step").forEach(el => el.classList.remove("active"));
      document.getElementById(`step${stepNumber}`).classList.add("active");

      for (let i = 1; i <= 3; i++) {
        const ind = document.getElementById(`ind-step${i}`);
        if (ind) ind.classList.toggle("active", i === stepNumber);
      }

      document.getElementById("summaryPopup").style.display = (stepNumber === 1) ? "block" : "none";
      window.scrollTo(0, 0);
    }

    document.getElementById("agreeTerms").addEventListener("change", (e) => {
      document.getElementById("submitBtn").disabled = !e.target.checked;
    });

    document.getElementById("orderForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.textContent = "送信中...";

      const payload = {
        grade: document.getElementById("grade").value,
        playerName: document.getElementById("playerName").value.trim(),
        uniformNumber: document.getElementById("uniformNumber").value,
        email: document.getElementById("email").value.trim(),
        items: getSelectedItemsData(),
        totalAmount: calculateTotal().totalPrice
      };

      const formData = new URLSearchParams();
      formData.append("data", JSON.stringify(payload));

      try {
        await fetch(GAS_ENDPOINT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded"
          },
          body: formData.toString()
        });
        
        goToStep(4);
      } catch (err) {
        console.error("送信エラー:", err);
        alert("送信に失敗しました。時間をおいて再度お試しください。");
        submitBtn.disabled = false;
        submitBtn.textContent = "申込する";
      }
    });
  </script>
</body>
</html>
